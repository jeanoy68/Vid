<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apprentissage Bilingue TTS + Caméra</title>
    <style>
        :root {
            --en-red: #d9534f;
            --fr-blue: #0275d8;
            --border-color: #eeeeee;
            --success-green: #28a745;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #ffffff;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 20px;
        }

        .input-section {
            width: 100%;
            max-width: 850px;
            margin-bottom: 30px;
        }

        textarea {
            width: 100%;
            height: 100px;
            background: #fafafa;
            color: #333;
            border: 1px solid #ddd;
            padding: 15px;
            border-radius: 12px;
            font-size: 16px;
            resize: none;
            outline: none;
            font-family: inherit;
        }

        .controls {
            margin-top: 15px;
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            padding: 12px 20px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        #loadBtn { background: #f0f0f0; color: #555; }
        #playBtn { background: #ff0000; color: white; }
        #pauseBtn { background: #f0ad4e; color: white; display: none; }
        #stopBtn { background: #333; color: white; }
        #loopBtn { background: #f0f0f0; color: #555; border: 2px solid transparent; }
        #torchBtn { background: #f0f0f0; color: #555; border: 2px solid transparent; }
        #torchBtn.active { background: #f1c40f; color: #333; border-color: #d4ac0d; }
        #recordBtn { background: #6c5ce7; color: white; }
        #recordBtn.recording { background: #e17055; animation: pulse 1.2s infinite; }

        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.02); }
            100% { opacity: 1; transform: scale(1); }
        }

        #loopBtn.active {
            background: var(--success-green);
            color: white;
            border-color: #1e7e34;
        }

        button:hover:not(:disabled) { transform: translateY(-1px); opacity: 0.9; }
        button:disabled { opacity: 0.2; cursor: not-allowed; }

        .video-stage {
            width: 100%;
            max-width: 850px;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0,0,0,0.08);
            border: 1px solid var(--border-color);
            margin-top: 10px;
            position: relative;
            background: #ffffff;
            aspect-ratio: 16 / 9;
        }

        #canvasPreview {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: contain;
        }

        #cameraVideo {
            position: absolute;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
            top: 0;
            left: 0;
        }

        .status-msg {
            margin-top: 12px;
            font-size: 14px;
            color: #666;
            text-align: center;
            min-height: 22px;
            padding: 0 15px;
            line-height: 1.4;
        }

        .status-msg.success { color: var(--success-green); font-weight: bold; }
        .status-msg.error { color: var(--en-red); font-weight: bold; }
        .status-msg.info { color: #0275d8; }
        .status-msg.warn { color: #e67e22; font-weight: bold; }

        .help-banner {
            width: 100%;
            max-width: 850px;
            background: #fff8e1;
            border: 1px solid #ffe0b2;
            border-radius: 10px;
            padding: 12px 16px;
            font-size: 13px;
            color: #7a5c00;
            margin-bottom: 15px;
            display: none;
        }

        .help-banner.visible { display: block; }
        .help-banner code {
            background: #fff3cd;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: monospace;
        }

        /* Indicateur audio live */
        .audio-meter {
            position: absolute;
            top: 12px;
            right: 12px;
            display: flex;
            align-items: center;
            gap: 4px;
            background: rgba(0,0,0,0.5);
            padding: 6px 10px;
            border-radius: 12px;
            font-size: 11px;
            color: white;
            font-weight: bold;
            display: none;
        }
        .audio-meter.visible { display: flex; }
        .audio-meter .bar {
            width: 4px;
            height: 12px;
            background: #4cd137;
            border-radius: 2px;
            transition: height 0.1s;
        }
    </style>
</head>
<body>

    <div id="helpBanner" class="help-banner">
        ⚠️ <strong>La caméra ne fonctionne pas ?</strong> Ouvrez cette page via un serveur local.
        Exemple : <code>python -m http.server 8000</code> puis <code>http://localhost:8000</code>
    </div>

    <div class="input-section">
        <textarea id="textInput" placeholder="Ligne 1 : Anglais&#10;Ligne 2 : Français&#10;Ligne 3 : Anglais..."></textarea>
        <div class="controls">
            <button id="loadBtn" onclick="processText()">1. Charger la liste</button>
            <button id="playBtn" onclick="startPlayAll()" disabled>▶ Lire tout</button>
            <button id="pauseBtn" onclick="togglePause()">⏸ Pause</button>
            <button id="stopBtn" onclick="stopSpeech()">⏹ Arrêter</button>
            <button id="loopBtn" onclick="toggleLoop()">🔁 Boucle : OFF</button>
            <button id="torchBtn" onclick="toggleTorch()" disabled>🔦 Flash : OFF</button>
            <button id="recordBtn" onclick="toggleRecording()" disabled>⏺ Enregistrer</button>
        </div>
        <div id="statusMsg" class="status-msg"></div>
    </div>

    <div class="video-stage">
        <canvas id="canvasPreview" width="1280" height="720"></canvas>
        <video id="cameraVideo" autoplay playsinline muted></video>
        <div id="audioMeter" class="audio-meter">
            <span>🎤</span>
            <div class="bar" id="bar1"></div>
            <div class="bar" id="bar2"></div>
            <div class="bar" id="bar3"></div>
            <div class="bar" id="bar4"></div>
        </div>
    </div>

    <script>
        // ==================== ÉTAT GLOBAL ====================
        const synth = window.speechSynthesis;
        let sentenceData = [];
        let currentIndex = 0;
        let repeatCounter = 0;
        let isPlaying = false;
        let isPaused = false;
        let isLooping = false;

        const canvas = document.getElementById('canvasPreview');
        const ctx = canvas.getContext('2d');
        const videoElement = document.getElementById('cameraVideo');
        let cameraStream = null;
        let cameraReady = false;
        let animationFrameId = null;
        let lastRenderTime = 0;

        let mediaRecorder = null;
        let recordedChunks = [];
        let isRecording = false;
        const RECORD_DURATION_MS = 300000;
        let recordTimer = null;

        // Audio recording
        let audioCtx = null;
        let micStream = null;
        let micAnalyser = null;
        let micSource = null;
        let recordDestination = null;
        let audioMeterRaf = null;

        let sentenceStartTime = 0;
        let sentenceDurationMs = 5000;

        let torchEnabled = false;
        let torchTrack = null;

        function setStatus(msg, type = '') {
            const el = document.getElementById('statusMsg');
            el.textContent = msg;
            el.className = 'status-msg' + (type ? ' ' + type : '');
            console.log('[STATUS]', msg);
        }

        // ==================== CAMÉRA ====================
        async function initCamera() {
            const banner = document.getElementById('helpBanner');

            if (!window.isSecureContext) {
                setStatus('❌ Caméra bloquée : ouvrez via http://localhost (pas file://)', 'error');
                banner.classList.add('visible');
                drawStaticScreen('Contexte non sécurisé');
                return;
            }

            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                setStatus('❌ getUserMedia non disponible', 'error');
                banner.classList.add('visible');
                drawStaticScreen('API caméra indisponible');
                return;
            }

            try {
                setStatus('Demande d\'accès à la caméra...', 'info');

                try {
                    cameraStream = await navigator.mediaDevices.getUserMedia({
                        video: { 
                            facingMode: 'user',
                            width: { ideal: 1280 }, 
                            height: { ideal: 720 } 
                        },
                        audio: false
                    });
                } catch (constraintErr) {
                    if (constraintErr.name === 'OverconstrainedError') {
                        cameraStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                    } else {
                        throw constraintErr;
                    }
                }

                videoElement.srcObject = cameraStream;
                await videoElement.play();
                cameraReady = true;
                banner.classList.remove('visible');
                setStatus('✅ Caméra active', 'success');

                setupTorch();
                startCanvasRendering();

            } catch (err) {
                let msg = '❌ ';
                switch (err.name) {
                    case 'NotAllowedError':
                    case 'PermissionDeniedError':
                        msg += 'Permission refusée. Autorisez la caméra dans la barre d\'adresse.';
                        break;
                    case 'NotFoundError':
                        msg += 'Aucune caméra détectée.';
                        break;
                    case 'NotReadableError':
                        msg += 'Caméra déjà utilisée par une autre application.';
                        break;
                    case 'SecurityError':
                        msg += 'Contexte non sécurisé (HTTPS ou localhost requis).';
                        banner.classList.add('visible');
                        break;
                    default:
                        msg += err.name + ' – ' + err.message;
                }
                setStatus(msg, 'error');
                drawStaticScreen('Caméra indisponible');
            }
        }

        function setupTorch() {
            const btn = document.getElementById('torchBtn');
            if (!cameraStream) return;
            const track = cameraStream.getVideoTracks()[0];
            if (!track) return;
            torchTrack = track;
            const capabilities = track.getCapabilities ? track.getCapabilities() : {};
            if (capabilities.torch) {
                btn.disabled = false;
            } else {
                btn.disabled = true;
                btn.title = 'Torche non supportée sur cet appareil';
            }
        }

        async function toggleTorch() {
            if (!torchTrack) return;
            try {
                torchEnabled = !torchEnabled;
                await torchTrack.applyConstraints({
                    advanced: [{ torch: torchEnabled }]
                });
                const btn = document.getElementById('torchBtn');
                if (torchEnabled) {
                    btn.classList.add('active');
                    btn.innerText = '🔦 Flash : ON';
                } else {
                    btn.classList.remove('active');
                    btn.innerText = '🔦 Flash : OFF';
                }
            } catch (err) {
                setStatus('Torche non disponible sur cet appareil', 'error');
                torchEnabled = false;
            }
        }

        function drawStaticScreen(text) {
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#999';
            ctx.font = 'bold 32px "Segoe UI", sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(text, canvas.width / 2, canvas.height / 2 - 20);
            ctx.font = '18px "Segoe UI", sans-serif';
            ctx.fillStyle = '#bbb';
            ctx.fillText('Ouvrez via http://localhost pour autoriser la caméra', canvas.width / 2, canvas.height / 2 + 30);
        }

        function drawRoundRect(ctx, x, y, w, h, r) {
            if (w < 2 * r) r = w / 2;
            if (h < 2 * r) r = h / 2;
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.arcTo(x + w, y, x + w, y + h, r);
            ctx.arcTo(x + w, y + h, x, y + h, r);
            ctx.arcTo(x, y + h, x, y, r);
            ctx.arcTo(x, y, x + w, y, r);
            ctx.closePath();
        }

        function startCanvasRendering() {
            if (animationFrameId) cancelAnimationFrame(animationFrameId);

            function render(timestamp) {
                if (timestamp - lastRenderTime < 33) {
                    animationFrameId = requestAnimationFrame(render);
                    return;
                }
                lastRenderTime = timestamp;

                const W = canvas.width;
                const H = canvas.height;

                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, W, H);

                if (sentenceData.length > 0) {
                    const activeIndex = isPlaying ? currentIndex : 0;
                    const item = sentenceData[activeIndex];

                    if (item) {
                        const textColor = item.isEnglish ? '#d9534f' : '#0275d8';

                        ctx.font = 'bold 56px "Segoe UI", sans-serif';
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';

                        const maxWidth = W - 200;
                        const words = item.text.split(' ');
                        const lines = [];
                        let currentLine = '';

                        words.forEach(word => {
                            const testLine = currentLine ? currentLine + ' ' + word : word;
                            const metrics = ctx.measureText(testLine);
                            if (metrics.width > maxWidth && currentLine) {
                                lines.push(currentLine);
                                currentLine = word;
                            } else {
                                currentLine = testLine;
                            }
                        });
                        lines.push(currentLine);

                        const lineHeight = 72;
                        const totalHeight = lines.length * lineHeight;
                        const startY = (H / 2) - (totalHeight / 2) - 20;

                        lines.forEach((line, i) => {
                            ctx.fillStyle = textColor;
                            ctx.fillText(line, W / 2, startY + (i * lineHeight));
                        });

                        const badgeText = item.isEnglish ? 'EN' : 'FR';
                        const badgeColor = item.isEnglish ? '#d9534f' : '#0275d8';
                        ctx.font = 'bold 16px "Segoe UI", sans-serif';
                        const badgeWidth = ctx.measureText(badgeText).width + 28;
                        ctx.fillStyle = badgeColor;
                        drawRoundRect(ctx, 30, 30, badgeWidth, 36, 18);
                        ctx.fill();
                        ctx.fillStyle = '#fff';
                        ctx.textAlign = 'center';
                        ctx.fillText(badgeText, 30 + badgeWidth / 2, 49);

                        if (isPlaying && item.maxRepeats > 1) {
                            ctx.font = '20px "Segoe UI", sans-serif';
                            ctx.fillStyle = '#aaa';
                            ctx.textAlign = 'center';
                            ctx.fillText(`Répétition ${repeatCounter + 1} / ${item.maxRepeats}`, W / 2, H - 130);
                        }

                        if (isPlaying && !isPaused) {
                            const elapsed = Date.now() - sentenceStartTime;
                            const remaining = Math.max(0, Math.ceil((sentenceDurationMs - elapsed) / 1000));
                            const displayNum = Math.min(5, remaining);

                            const cx = W - 110;
                            const cy = 100;
                            const radius = 50;
                            const progress = Math.min(1, elapsed / sentenceDurationMs);

                            ctx.beginPath();
                            ctx.arc(cx, cy, radius, 0, 2 * Math.PI);
                            ctx.fillStyle = item.isEnglish ? '#fce4e3' : '#e0ecf8';
                            ctx.fill();

                            ctx.beginPath();
                            ctx.arc(cx, cy, radius, -Math.PI / 2, -Math.PI / 2 + (2 * Math.PI * progress));
                            ctx.strokeStyle = item.isEnglish ? '#d9534f' : '#0275d8';
                            ctx.lineWidth = 8;
                            ctx.lineCap = 'round';
                            ctx.stroke();

                            ctx.fillStyle = item.isEnglish ? '#d9534f' : '#0275d8';
                            ctx.font = 'bold 42px "Segoe UI", sans-serif';
                            ctx.textAlign = 'center';
                            ctx.textBaseline = 'middle';
                            ctx.fillText(String(displayNum), cx, cy + 2);

                            ctx.font = 'bold 12px "Segoe UI", sans-serif';
                            ctx.fillStyle = '#aaa';
                            ctx.fillText('SEC', cx, cy + 32);
                        }
                    }

                    if (isPlaying) {
                        const progress = (currentIndex + (repeatCounter / (sentenceData[currentIndex]?.maxRepeats || 1))) / sentenceData.length;
                        const barWidth = W * 0.6;
                        const barX = (W - barWidth) / 2;
                        const barY = H - 50;

                        ctx.fillStyle = '#eee';
                        drawRoundRect(ctx, barX, barY, barWidth, 8, 4);
                        ctx.fill();

                        ctx.fillStyle = '#6c5ce7';
                        drawRoundRect(ctx, barX, barY, barWidth * Math.min(progress, 1), 8, 4);
                        ctx.fill();
                    }
                } else {
                    ctx.font = 'bold 36px "Segoe UI", sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillStyle = '#ccc';
                    ctx.fillText('Chargez une liste pour commencer', W / 2, H / 2);
                }

                if (cameraReady && videoElement.readyState >= 2) {
                    const camW = 320;
                    const camH = 180;
                    const camX = W - camW - 24;
                    const camY = H - camH - 24;

                    ctx.save();
                    ctx.shadowColor = 'rgba(0,0,0,0.35)';
                    ctx.shadowBlur = 20;
                    ctx.shadowOffsetY = 8;
                    drawRoundRect(ctx, camX, camY, camW, camH, 16);
                    ctx.fillStyle = '#000';
                    ctx.fill();
                    ctx.restore();

                    ctx.save();
                    drawRoundRect(ctx, camX, camY, camW, camH, 16);
                    ctx.clip();
                    ctx.translate(camX + camW, camY);
                    ctx.scale(-1, 1);
                    ctx.drawImage(videoElement, 0, 0, camW, camH);
                    ctx.restore();

                    ctx.save();
                    drawRoundRect(ctx, camX, camY, camW, camH, 16);
                    ctx.strokeStyle = torchEnabled ? '#f1c40f' : 'rgba(255,255,255,0.9)';
                    ctx.lineWidth = 3;
                    ctx.stroke();
                    ctx.restore();
                }

                animationFrameId = requestAnimationFrame(render);
            }

            animationFrameId = requestAnimationFrame(render);
        }

        // ==================== TEXTE & TTS ====================
        function processText() {
            stopSpeech();
            const input = document.getElementById('textInput').value;
            const lines = input.split('\n').map(l => l.trim()).filter(l => l !== "");

            sentenceData = [];

            lines.forEach((line, index) => {
                const isEnglish = index % 2 === 0;
                sentenceData.push({
                    text: line,
                    lang: isEnglish ? 'en-US' : 'fr-FR',
                    isEnglish: isEnglish,
                    maxRepeats: isEnglish ? 3 : 2
                });
            });

            if (sentenceData.length > 0) {
                document.getElementById('playBtn').disabled = false;
                document.getElementById('recordBtn').disabled = false;
                setStatus(`✅ Liste chargée : ${sentenceData.length} lignes`, 'success');
                if (!animationFrameId) startCanvasRendering();
            } else {
                document.getElementById('playBtn').disabled = true;
                document.getElementById('recordBtn').disabled = true;
                setStatus('Aucune ligne valide', 'error');
            }
        }

        function estimateDuration(text, isEnglish) {
            const words = text.split(/\s+/).length;
            const wpm = isEnglish ? 140 : 160;
            const minutes = words / wpm;
            const sec = Math.max(2, minutes * 60);
            return Math.round(sec * 1000 + 500);
        }

        function speakStep() {
            if (!isPlaying || isPaused) return;

            if (currentIndex >= sentenceData.length) {
                if (isLooping) {
                    currentIndex = 0;
                    repeatCounter = 0;
                    setTimeout(speakStep, 1000);
                } else {
                    stopSpeech();
                }
                return;
            }

            const currentItem = sentenceData[currentIndex];
            const utterance = new SpeechSynthesisUtterance(currentItem.text);
            utterance.lang = currentItem.lang;

            const voices = synth.getVoices();
            const voice = voices.find(v => v.lang.startsWith(currentItem.lang));
            if (voice) utterance.voice = voice;

            // IMPORTANT: volume max pour que le micro capte bien
            utterance.volume = 1.0;
            utterance.rate = 0.95;
            utterance.pitch = 1.0;

            sentenceDurationMs = estimateDuration(currentItem.text, currentItem.isEnglish);
            sentenceStartTime = Date.now();

            utterance.onend = () => {
                if (!isPlaying || isPaused) return;
                repeatCounter++;
                if (repeatCounter < currentItem.maxRepeats) {
                    setTimeout(speakStep, 400);
                } else {
                    currentIndex++;
                    repeatCounter = 0;
                    setTimeout(speakStep, 800);
                }
            };

            utterance.onerror = (e) => {
                console.warn('Erreur TTS:', e);
                if (isPlaying) stopSpeech();
            };

            synth.speak(utterance);
        }

        function startPlayAll() {
            if (sentenceData.length === 0) return;
            synth.cancel();
            isPlaying = true;
            isPaused = false;
            currentIndex = 0;
            repeatCounter = 0;

            document.getElementById('playBtn').style.display = 'none';
            document.getElementById('pauseBtn').style.display = 'flex';
            document.getElementById('pauseBtn').innerText = "⏸ Pause";

            speakStep();
        }

        function togglePause() {
            if (!isPlaying) return;
            if (!isPaused) {
                isPaused = true;
                synth.pause();
                document.getElementById('pauseBtn').innerText = "▶ Reprendre";
            } else {
                isPaused = false;
                document.getElementById('pauseBtn').innerText = "⏸ Pause";
                if (synth.paused) synth.resume();
                else speakStep();
            }
        }

        function stopSpeech() {
            isPlaying = false;
            isPaused = false;
            synth.cancel();
            document.getElementById('playBtn').style.display = 'flex';
            document.getElementById('playBtn').disabled = (sentenceData.length === 0);
            document.getElementById('pauseBtn').style.display = 'none';
        }

        function toggleLoop() {
            isLooping = !isLooping;
            const btn = document.getElementById('loopBtn');
            if (isLooping) {
                btn.classList.add('active');
                btn.innerText = "🔁 Boucle : ON";
            } else {
                btn.classList.remove('active');
                btn.innerText = "🔁 Boucle : OFF";
            }
        }

        // ==================== CAPTURE MIC (pour l'audio dans la vidéo) ====================
        async function startMicCapture() {
            try {
                // Demander explicitement l'accès au micro
                const micConstraints = {
                    audio: {
                        echoCancellation: false,
                        noiseSuppression: false,
                        autoGainControl: false,
                        sampleRate: 48000
                    }
                };
                micStream = await navigator.mediaDevices.getUserMedia(micConstraints);
                console.log('Micro capturé:', micStream.getAudioTracks().length, 'piste(s)');

                // Configurer AudioContext pour mixer + analyser
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                
                // Reprendre le contexte si suspendu (Chrome autoplay policy)
                if (audioCtx.state === 'suspended') {
                    await audioCtx.resume();
                }

                // Source du micro
                micSource = audioCtx.createMediaStreamSource(micStream);

                // Analyseur pour le VU-mètre
                micAnalyser = audioCtx.createAnalyser();
                micAnalyser.fftSize = 256;
                micSource.connect(micAnalyser);

                // Destination d'enregistrement (mix final)
                recordDestination = audioCtx.createMediaStreamDestination();
                micSource.connect(recordDestination);

                // Afficher le VU-mètre
                document.getElementById('audioMeter').classList.add('visible');
                startAudioMeter();

                return recordDestination.stream;
            } catch (err) {
                console.error('Micro non accessible:', err);
                setStatus('⚠️ Micro inaccessible : ' + err.name + '. La vidéo n\'aura pas de son.', 'warn');
                return null;
            }
        }

        function startAudioMeter() {
            if (!micAnalyser) return;
            const dataArray = new Uint8Array(micAnalyser.frequencyBinCount);
            const bars = [
                document.getElementById('bar1'),
                document.getElementById('bar2'),
                document.getElementById('bar3'),
                document.getElementById('bar4')
            ];

            function update() {
                if (!micAnalyser) return;
                micAnalyser.getByteFrequencyData(dataArray);
                let sum = 0;
                for (let i = 0; i < dataArray.length; i++) sum += dataArray[i];
                const avg = sum / dataArray.length;
                const level = Math.min(1, avg / 100);

                bars.forEach((bar, i) => {
                    const threshold = (i + 1) / 4;
                    if (level >= threshold * 0.5) {
                        bar.style.height = (8 + level * 16) + 'px';
                        bar.style.background = level > 0.5 ? '#f39c12' : '#4cd137';
                    } else {
                        bar.style.height = '8px';
                        bar.style.background = '#555';
                    }
                });

                audioMeterRaf = requestAnimationFrame(update);
            }
            update();
        }

        function stopMicCapture() {
            if (audioMeterRaf) {
                cancelAnimationFrame(audioMeterRaf);
                audioMeterRaf = null;
            }
            if (micStream) {
                micStream.getTracks().forEach(t => t.stop());
                micStream = null;
            }
            if (audioCtx) {
                audioCtx.close().catch(() => {});
                audioCtx = null;
            }
            micAnalyser = null;
            micSource = null;
            recordDestination = null;
            document.getElementById('audioMeter').classList.remove('visible');
        }

        // ==================== ENREGISTREMENT ====================
        async function toggleRecording() {
            if (isRecording) { stopRecording(); return; }
            await startRecording();
        }

        function pickBestMimeType() {
            const candidates = [
                'video/mp4;codecs=avc1.42E01E,mp4a.40.2',
                'video/mp4;codecs=avc1.42E01E',
                'video/mp4;codecs=h264,aac',
                'video/mp4',
                'video/webm;codecs=h264,opus',
                'video/webm;codecs=vp9,opus',
                'video/webm;codecs=vp8,opus',
                'video/webm'
            ];
            for (const c of candidates) {
                if (MediaRecorder.isTypeSupported(c)) {
                    console.log('MIME retenu:', c);
                    return c;
                }
            }
            return 'video/webm';
        }

        async function startRecording() {
            if (sentenceData.length === 0) {
                setStatus('Chargez d\'abord une liste', 'error');
                return;
            }
            if (!cameraReady) {
                await initCamera();
                await new Promise(r => setTimeout(r, 800));
            }

            setStatus('🎤 Demande d\'accès au micro...', 'info');

            // Démarrer la capture micro (indispensable pour avoir du son)
            const micAudioStream = await startMicCapture();
            if (!micAudioStream) {
                setStatus('❌ Impossible d\'enregistrer le son : autorisez le micro.', 'error');
                return;
            }

            recordedChunks = [];
            const canvasStream = canvas.captureStream(30);

            // Combiner vidéo (canvas) + audio (micro qui capte le TTS)
            const combinedStream = new MediaStream([
                ...canvasStream.getVideoTracks(),
                ...micAudioStream.getAudioTracks()
            ]);

            const mimeType = pickBestMimeType();

            try {
                mediaRecorder = new MediaRecorder(combinedStream, { 
                    mimeType,
                    videoBitsPerSecond: 4000000,
                    audioBitsPerSecond: 128000
                });
            } catch (e) {
                console.error('Erreur MediaRecorder:', e);
                setStatus('Enregistrement non supporté : ' + e.message, 'error');
                stopMicCapture();
                return;
            }

            mediaRecorder.ondataavailable = (event) => {
                if (event.data && event.data.size > 0) recordedChunks.push(event.data);
            };

            mediaRecorder.onstop = () => {
                stopMicCapture();

                if (recordedChunks.length === 0) {
                    setStatus('Aucune donnée enregistrée', 'error');
                    isRecording = false;
                    return;
                }

                const actualMime = mediaRecorder.mimeType || mimeType;
                const ext = actualMime.includes('mp4') ? 'mp4' : 'webm';
                const blob = new Blob(recordedChunks, { type: actualMime.split(';')[0] });
                
                console.log('Enregistrement terminé:', blob.size, 'octets,', ext);

                if (blob.size < 1000) {
                    setStatus('Enregistrement trop court ou vide', 'error');
                    isRecording = false;
                    return;
                }

                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `apprentissage-bilingue-${Date.now()}.${ext}`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                setTimeout(() => URL.revokeObjectURL(url), 10000);
                
                setStatus(`✅ Vidéo téléchargée (${ext.toUpperCase()}, ${(blob.size/1024/1024).toFixed(1)} Mo) — avec son !`, 'success');

                isRecording = false;
                const btn = document.getElementById('recordBtn');
                btn.classList.remove('recording');
                btn.innerText = '⏺ Enregistrer';
            };

            mediaRecorder.onerror = (e) => {
                console.error('MediaRecorder error:', e);
                setStatus('Erreur d\'enregistrement : ' + (e.error?.message || e.error), 'error');
                stopMicCapture();
            };

            mediaRecorder.start(1000);
            isRecording = true;

            const btn = document.getElementById('recordBtn');
            btn.classList.add('recording');
            btn.innerText = '⏹ Arrêter';
            setStatus(`⏺ Enregistrement (son + vidéo)... Parlez et laissez le TTS jouer.`, 'success');

            if (!isPlaying) startPlayAll();

            recordTimer = setTimeout(() => {
                if (isRecording) stopRecording();
            }, RECORD_DURATION_MS);
        }

        function stopRecording() {
            if (!isRecording) return;
            if (recordTimer) { clearTimeout(recordTimer); recordTimer = null; }
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.requestData();
                setTimeout(() => mediaRecorder.stop(), 200);
            }
        }

        // ==================== INIT ====================
        window.addEventListener('load', () => {
            startCanvasRendering();
            initCamera();

            if (speechSynthesis.onvoiceschanged !== undefined) {
                speechSynthesis.onvoiceschanged = () => synth.getVoices();
            }
        });

        window.addEventListener('beforeunload', () => {
            if (cameraStream) cameraStream.getTracks().forEach(t => t.stop());
            if (micStream) micStream.getTracks().forEach(t => t.stop());
            if (animationFrameId) cancelAnimationFrame(animationFrameId);
        });
    </script>
</body>
</html>
