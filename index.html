<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apprentissage Bilingue · Tableau + Caméra Ronde</title>
    <style>
        :root {
            --en-red: #d9534f;
            --fr-blue: #0275d8;
            --border-color: #eeeeee;
            --success-green: #28a745;
            --accent: #6c5ce7;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #ffffff;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 20px;
        }

        .input-section {
            width: 100%;
            max-width: 900px;
            margin-bottom: 20px;
        }

        textarea {
            width: 100%;
            height: 100px;
            background: #fafafa;
            color: #333;
            border: 1px solid #ddd;
            padding: 15px;
            border-radius: 12px;
            font-size: 16px;
            resize: none;
            outline: none;
            font-family: inherit;
        }

        .controls {
            margin-top: 15px;
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            padding: 12px 20px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        #loadBtn { background: #f0f0f0; color: #555; }
        #playBtn { background: #ff0000; color: white; }
        #pauseBtn { background: #f0ad4e; color: white; display: none; }
        #stopBtn { background: #333; color: white; }
        #loopBtn { background: #f0f0f0; color: #555; border: 2px solid transparent; }
        #torchBtn { background: #f0f0f0; color: #555; border: 2px solid transparent; }
        #torchBtn.active { background: #f1c40f; color: #333; border-color: #d4ac0d; }
        #recordBtn { background: #6c5ce7; color: white; }
        #recordBtn.recording { background: #e17055; animation: pulse 1.2s infinite; }

        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.02); }
            100% { opacity: 1; transform: scale(1); }
        }

        #loopBtn.active {
            background: var(--success-green);
            color: white;
            border-color: #1e7e34;
        }

        button:hover:not(:disabled) { transform: translateY(-1px); opacity: 0.9; }
        button:disabled { opacity: 0.2; cursor: not-allowed; }

        /* ===== Barre d'options ===== */
        .options-bar {
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
            justify-content: center;
            margin-bottom: 15px;
            padding: 12px 16px;
            background: #f8f9ff;
            border: 1px solid #e6e9ff;
            border-radius: 12px;
            font-size: 13px;
        }

        .options-bar label {
            font-weight: 600;
            color: #555;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .options-bar select, .options-bar input[type="range"], .options-bar input[type="color"] {
            border: 1px solid #ccc;
            border-radius: 6px;
            padding: 6px 10px;
            background: white;
            font-family: inherit;
            font-size: 13px;
            color: #333;
            cursor: pointer;
        }

        .options-bar input[type="range"] { padding: 0; width: 110px; }
        .options-bar input[type="color"] { padding: 2px; width: 38px; height: 32px; }

        .swatch-group { display: flex; gap: 6px; align-items: center; }

        .swatch {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
            transition: transform 0.15s, border-color 0.15s;
        }
        .swatch:hover { transform: scale(1.15); }
        .swatch.active { border-color: var(--accent); box-shadow: 0 0 0 2px #fff, 0 0 0 4px var(--accent); }

        /* Format toggle */
        .format-toggle {
            display: flex;
            gap: 4px;
            background: #fff;
            border: 1px solid #ccc;
            border-radius: 8px;
            padding: 3px;
        }
        .format-toggle button {
            padding: 6px 12px;
            border-radius: 6px;
            background: transparent;
            color: #555;
            font-size: 12px;
            font-weight: 700;
        }
        .format-toggle button.active {
            background: var(--accent);
            color: white;
        }

        .video-stage {
            width: 100%;
            max-width: 900px;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
            border: 1px solid var(--border-color);
            margin-top: 5px;
            position: relative;
            background: #1e1e2e;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: aspect-ratio 0.3s ease;
        }

        #boardCanvas {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: contain;
            cursor: crosshair;
            touch-action: none;
        }

        #cameraVideo {
            position: absolute;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
            top: 0;
            left: 0;
        }

        .status-msg {
            margin-top: 12px;
            font-size: 14px;
            color: #666;
            text-align: center;
            min-height: 22px;
            padding: 0 15px;
            line-height: 1.4;
        }

        .status-msg.success { color: var(--success-green); font-weight: bold; }
        .status-msg.error { color: var(--en-red); font-weight: bold; }
        .status-msg.info { color: #0275d8; }
        .status-msg.warn { color: #e67e22; font-weight: bold; }

        .help-banner {
            width: 100%;
            max-width: 900px;
            background: #fff8e1;
            border: 1px solid #ffe0b2;
            border-radius: 10px;
            padding: 12px 16px;
            font-size: 13px;
            color: #7a5c00;
            margin-bottom: 15px;
            display: none;
        }
        .help-banner.visible { display: block; }
        .help-banner code {
            background: #fff3cd;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: monospace;
        }

        .mute-note {
            width: 100%;
            max-width: 900px;
            font-size: 13px;
            color: #888;
            text-align: center;
            margin-top: 5px;
            font-style: italic;
        }

        .drag-hint {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.6);
            color: white;
            font-size: 11px;
            padding: 5px 12px;
            border-radius: 20px;
            pointer-events: none;
            opacity: 0.85;
            transition: opacity 0.3s;
            z-index: 5;
        }

        .loading-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.7);
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-weight: bold;
            z-index: 10;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }
        .loading-overlay.visible {
            opacity: 1;
            pointer-events: all;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="helpBanner" class="help-banner">
        ⚠️ <strong>La caméra ne fonctionne pas ?</strong> Ouvrez cette page via un serveur local.
        Exemple : <code>python -m http.server 8000</code> puis <code>http://localhost:8000</code>
    </div>

    <div class="input-section">
        <textarea id="textInput" placeholder="Ligne 1 : Anglais&#10;Ligne 2 : Français&#10;Ligne 3 : Anglais..."></textarea>
        <div class="controls">
            <button id="loadBtn" onclick="processText()">1. Charger la liste</button>
            <button id="playBtn" onclick="startPlayAll()" disabled>▶ Lire tout</button>
            <button id="pauseBtn" onclick="togglePause()">⏸ Pause</button>
            <button id="stopBtn" onclick="stopSpeech()">⏹ Arrêter</button>
            <button id="loopBtn" onclick="toggleLoop()">🔁 Boucle : OFF</button>
            <button id="torchBtn" onclick="toggleTorch()" disabled>🔦 Flash : OFF</button>
            <button id="recordBtn" onclick="toggleRecording()" disabled>⏺ Enregistrer</button>
        </div>
        <div id="statusMsg" class="status-msg"></div>
        <div class="mute-note">🔇 TTS désactivé (muet) · Fond virtuel blanc (colorisable) derrière le visage</div>
    </div>

    <!-- Barre d'options -->
    <div class="options-bar">
        <label>📐 Format :
            <div class="format-toggle" id="formatToggle">
                <button data-format="youtube" class="active">▶️ YouTube 16:9</button>
                <button data-format="tiktok">📱 TikTok 9:16</button>
                <button data-format="short">🎬 Short 9:16</button>
            </div>
        </label>

        <label>🎨 Tableau :
            <div class="swatch-group" id="boardSwatches">
                <div class="swatch active" data-color="#1e1e2e" style="background:#1e1e2e" title="Ardoise sombre"></div>
                <div class="swatch" data-color="#0d3b66" style="background:#0d3b66" title="Bleu nuit"></div>
                <div class="swatch" data-color="#2d4a22" style="background:#2d4a22" title="Vert forêt"></div>
                <div class="swatch" data-color="#4a1e2e" style="background:#4a1e2e" title="Bordeaux"></div>
                <div class="swatch" data-color="#fdf6e3" style="background:#fdf6e3;border:1px solid #ccc" title="Crème clair"></div>
            </div>
        </label>

        <label>🖼️ Cadre :
            <select id="frameSelect">
                <option value="none">Aucun</option>
                <option value="white" selected>Blanc épais</option>
                <option value="glow">Halo lumineux</option>
                <option value="neon">Néon</option>
                <option value="gold">Or</option>
                <option value="dashed">Pointillé</option>
            </select>
        </label>

        <label>✨ Filtre caméra :
            <select id="filterSelect">
                <option value="none">Aucun</option>
                <option value="warm">Chaleureux</option>
                <option value="cool">Froid</option>
                <option value="sepia">Sépia</option>
                <option value="grayscale">Noir & blanc</option>
                <option value="vintage">Vintage</option>
                <option value="vivid">Vif</option>
                <option value="soft">Doux</option>
                <option value="contrast">Contraste</option>
            </select>
        </label>

        <label>🟩 Fond visage :
            <input type="color" id="bgColorInput" value="#ffffff">
            <div class="swatch-group" id="bgSwatches">
                <div class="swatch active" data-color="#ffffff" style="background:#ffffff;border:1px solid #ccc" title="Blanc"></div>
                <div class="swatch" data-color="#e0f7fa" style="background:#e0f7fa" title="Bleu clair"></div>
                <div class="swatch" data-color="#fff3e0" style="background:#fff3e0" title="Crème"></div>
                <div class="swatch" data-color="#e8f5e9" style="background:#e8f5e9" title="Vert menthe"></div>
                <div class="swatch" data-color="#f3e5f5" style="background:#f3e5f5" title="Lavande"></div>
                <div class="swatch" data-color="#ffebee" style="background:#ffebee" title="Rose"></div>
            </div>
        </label>

        <label>📏 Taille :
            <input type="range" id="camSize" min="80" max="360" value="160" step="10">
            <span id="camSizeVal" style="font-weight:700;color:var(--accent);min-width:38px;">160</span>
        </label>
    </div>

    <div class="video-stage" id="videoStage">
        <canvas id="boardCanvas" width="1280" height="720"></canvas>
        <video id="cameraVideo" autoplay playsinline muted></video>
        <div class="drag-hint" id="dragHint">✋ Glissez la caméra · ↕️ Molette pour redimensionner</div>
        <div class="loading-overlay" id="loadingOverlay">
            <div class="spinner"></div>
            <div>Chargement du fond virtuel...</div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/selfie_segmentation.js" crossorigin="anonymous"></script>

    <script>
        // ==================== ÉTAT GLOBAL ====================
        const synth = window.speechSynthesis;
        let sentenceData = [];
        let currentIndex = 0;
        let repeatCounter = 0;
        let isPlaying = false;
        let isPaused = false;
        let isLooping = false;

        const boardCanvas = document.getElementById('boardCanvas');
        const boardCtx = boardCanvas.getContext('2d');
        const videoElement = document.getElementById('cameraVideo');
        const videoStage = document.getElementById('videoStage');
        const loadingOverlay = document.getElementById('loadingOverlay');
        let cameraStream = null;
        let cameraReady = false;
        let animationFrameId = null;
        let lastRenderTime = 0;

        let mediaRecorder = null;
        let recordedChunks = [];
        let isRecording = false;
        const RECORD_DURATION_MS = 300000;
        let recordTimer = null;

        // Audio
        let audioCtx = null;
        let micStream = null;
        let micAnalyser = null;
        let micSource = null;
        let recordDestination = null;

        let sentenceStartTime = 0;
        let sentenceDurationMs = 5000;

        let torchEnabled = false;
        let torchTrack = null;

        // --- Personnalisation ---
        let boardColor = '#1e1e2e';
        let frameStyle = 'white';
        let cameraFilter = 'none';
        let camSize = 160;
        let faceBgColor = '#ffffff'; // fond virtuel derrière le visage

        // --- Format ---
        let currentFormat = 'youtube';
        const FORMATS = {
            youtube: { width: 1280, height: 720,  label: 'YouTube 16:9' },
            tiktok:  { width: 720,  height: 1280, label: 'TikTok 9:16'  },
            short:   { width: 720,  height: 1280, label: 'Short 9:16'   }
        };

        // --- Caméra ronde déplaçable ---
        let camX = 0;
        let camY = 0;
        let camRadius = 160;
        let isDragging = false;
        let dragOffsetX = 0;
        let dragOffsetY = 0;
        let hasDraggedOnce = false;
        let isResizing = false;
        let resizeStartDist = 0;
        let resizeStartRadius = 0;

        // --- Segmentation (fond virtuel) ---
        let selfieSegmentation = null;
        let segmentationReady = false;
        let segmentationFrame = document.createElement('canvas');
        segmentationFrame.width = 1280;
        segmentationFrame.height = 720;
        let segFrameCtx = segmentationFrame.getContext('2d');
        // Canvas intermédiaire pour composer le fond coloré
        let compositeCanvas = document.createElement('canvas');
        compositeCanvas.width = 1280;
        compositeCanvas.height = 720;
        let compositeCtx = compositeCanvas.getContext('2d');
        let lastSegmentationResult = null;

        function setStatus(msg, type = '') {
            const el = document.getElementById('statusMsg');
            el.textContent = msg;
            el.className = 'status-msg' + (type ? ' ' + type : '');
            console.log('[STATUS]', msg);
        }

        // ==================== FORMAT ====================
        function applyFormat(format) {
            currentFormat = format;
            const cfg = FORMATS[format];

            boardCanvas.width = cfg.width;
            boardCanvas.height = cfg.height;

            segmentationFrame.width = cfg.width;
            segmentationFrame.height = cfg.height;
            compositeCanvas.width = cfg.width;
            compositeCanvas.height = cfg.height;

            videoStage.style.aspectRatio = `${cfg.width} / ${cfg.height}`;

            const base = Math.min(cfg.width, cfg.height);
            if (!hasDraggedOnce) {
                camRadius = Math.round(base * 0.18);
                camX = cfg.width - camRadius - 40;
                camY = cfg.height - camRadius - 40;
            } else {
                camRadius = Math.min(camRadius, Math.round(base * 0.45));
                camX = Math.max(camRadius, Math.min(cfg.width - camRadius, camX));
                camY = Math.max(camRadius, Math.min(cfg.height - camRadius, camY));
            }

            camSize = Math.round(camRadius);
            const slider = document.getElementById('camSize');
            slider.max = Math.round(base * 0.45);
            slider.value = Math.min(slider.max, Math.max(slider.min, camSize));
            document.getElementById('camSizeVal').textContent = slider.value;

            document.querySelectorAll('#formatToggle button').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.format === format);
            });

            setStatus(`📐 Format : ${cfg.label} (${cfg.width}×${cfg.height})`, 'info');
        }

        document.querySelectorAll('#formatToggle button').forEach(btn => {
            btn.addEventListener('click', () => {
                const fmt = btn.dataset.format;
                if (fmt !== currentFormat) applyFormat(fmt);
            });
        });

        // ==================== FILTRES CANVAS ====================
        function getFilterString() {
            switch (cameraFilter) {
                case 'warm':      return 'saturate(1.3) sepia(0.25) brightness(1.05)';
                case 'cool':      return 'saturate(1.1) hue-rotate(-15deg) brightness(1.03)';
                case 'sepia':     return 'sepia(0.85) contrast(1.05)';
                case 'grayscale': return 'grayscale(1) contrast(1.1)';
                case 'vintage':   return 'sepia(0.4) saturate(1.4) contrast(0.9) brightness(1.05)';
                case 'vivid':     return 'saturate(1.7) contrast(1.15) brightness(1.05)';
                case 'soft':      return 'saturate(0.85) brightness(1.12) contrast(0.92) blur(0.4px)';
                case 'contrast':  return 'contrast(1.35) saturate(1.2)';
                default:          return 'none';
            }
        }

        // ==================== SEGMENTATION (fond virtuel) ====================
        function initSegmentation() {
            if (typeof SelfieSegmentation === 'undefined') {
                console.warn('MediaPipe SelfieSegmentation non chargé');
                setStatus('⚠️ Fond virtuel indisponible (librairie non chargée)', 'warn');
                return;
            }

            loadingOverlay.classList.add('visible');

            try {
                selfieSegmentation = new SelfieSegmentation({
                    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/${file}`
                });

                selfieSegmentation.setOptions({
                    modelSelection: 1, // 1 = paysage (plus rapide), 0 = général (plus précis)
                });

                selfieSegmentation.onResults((results) => {
                    segmentationReady = true;
                    lastSegmentationResult = results;
                    loadingOverlay.classList.remove('visible');
                });

                // Démarrer la boucle d'envoi de frames à MediaPipe
                startSegmentationLoop();
                setStatus('✅ Fond virtuel prêt', 'success');
            } catch (e) {
                console.error('Erreur init segmentation:', e);
                setStatus('⚠️ Impossible d\'initialiser le fond virtuel', 'warn');
                loadingOverlay.classList.remove('visible');
            }
        }

        let segmentationLoopActive = false;
        async function startSegmentationLoop() {
            if (segmentationLoopActive) return;
            segmentationLoopActive = true;
            const loop = async () => {
                if (selfieSegmentation && cameraReady && videoElement.readyState >= 2) {
                    try {
                        await selfieSegmentation.send({ image: videoElement });
                    } catch (e) {
                        // Ignorer les erreurs transitoires
                    }
                }
                if (segmentationLoopActive) {
                    requestAnimationFrame(loop);
                }
            };
            loop();
        }

        // Compose l'image de la caméra avec le fond coloré (utilise le dernier masque)
        function getCameraWithBackground() {
            const W = boardCanvas.width;
            const H = boardCanvas.height;

            if (!lastSegmentationResult || !lastSegmentationResult.segmentationMask) {
                // Pas encore de masque : on renvoie la vidéo brute
                return videoElement;
            }

            const results = lastSegmentationResult;

            // 1) Dessiner le fond coloré sur le composite
            compositeCtx.save();
            compositeCtx.fillStyle = faceBgColor;
            compositeCtx.fillRect(0, 0, W, H);
            compositeCtx.restore();

            // 2) Dessiner la personne (masque) sur un canvas temporaire
            //    On utilise le mask pour ne garder que la personne
            compositeCtx.save();
            compositeCtx.globalCompositeOperation = 'source-over';

            // Créer un canvas temporaire pour la personne découpée
            const tmp = document.createElement('canvas');
            tmp.width = W;
            tmp.height = H;
            const tmpCtx = tmp.getContext('2d');

            // Dessiner la vidéo redimensionnée (cover)
            const vW = videoElement.videoWidth || 640;
            const vH = videoElement.videoHeight || 480;
            const scale = Math.max(W / vW, H / vH);
            const dW = vW * scale;
            const dH = vH * scale;
            const dX = (W - dW) / 2;
            const dY = (H - dH) / 2;
            tmpCtx.drawImage(videoElement, dX, dY, dW, dH);

            // Appliquer le masque : garder seulement les pixels où mask > seuil
            const mask = results.segmentationMask;
            tmpCtx.globalCompositeOperation = 'destination-in';
            tmpCtx.drawImage(mask, 0, 0, W, H);

            // 3) Dessiner la personne découpée par-dessus le fond coloré
            compositeCtx.drawImage(tmp, 0, 0);

            compositeCtx.restore();
            return compositeCanvas;
        }

        // ==================== INIT CAMÉRA ====================
        async function initCamera() {
            const banner = document.getElementById('helpBanner');

            if (!window.isSecureContext) {
                setStatus('❌ Caméra bloquée : ouvrez via http://localhost (pas file://)', 'error');
                banner.classList.add('visible');
                return;
            }
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                setStatus('❌ getUserMedia non disponible', 'error');
                banner.classList.add('visible');
                return;
            }

            try {
                setStatus('Demande d\'accès à la caméra...', 'info');
                try {
                    cameraStream = await navigator.mediaDevices.getUserMedia({
                        video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } },
                        audio: false
                    });
                } catch (constraintErr) {
                    if (constraintErr.name === 'OverconstrainedError') {
                        cameraStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                    } else {
                        throw constraintErr;
                    }
                }

                videoElement.srcObject = cameraStream;
                await videoElement.play();
                cameraReady = true;
                banner.classList.remove('visible');
                setStatus('✅ Caméra active · fond virtuel en chargement...', 'success');

                setupTorch();
                startBoardRendering();
                initSegmentation();
            } catch (err) {
                let msg = '❌ ';
                switch (err.name) {
                    case 'NotAllowedError':
                    case 'PermissionDeniedError':
                        msg += 'Permission refusée. Autorisez la caméra.';
                        break;
                    case 'NotFoundError': msg += 'Aucune caméra détectée.'; break;
                    case 'NotReadableError': msg += 'Caméra utilisée ailleurs.'; break;
                    case 'SecurityError':
                        msg += 'Contexte non sécurisé (HTTPS/localhost).';
                        banner.classList.add('visible');
                        break;
                    default: msg += err.name + ' – ' + err.message;
                }
                setStatus(msg, 'error');
            }
        }

        function setupTorch() {
            const btn = document.getElementById('torchBtn');
            if (!cameraStream) return;
            const track = cameraStream.getVideoTracks()[0];
            if (!track) return;
            torchTrack = track;
            const capabilities = track.getCapabilities ? track.getCapabilities() : {};
            if (capabilities.torch) btn.disabled = false;
            else { btn.disabled = true; btn.title = 'Torche non supportée'; }
        }

        async function toggleTorch() {
            if (!torchTrack) return;
            try {
                torchEnabled = !torchEnabled;
                await torchTrack.applyConstraints({ advanced: [{ torch: torchEnabled }] });
                const btn = document.getElementById('torchBtn');
                if (torchEnabled) { btn.classList.add('active'); btn.innerText = '🔦 Flash : ON'; }
                else { btn.classList.remove('active'); btn.innerText = '🔦 Flash : OFF'; }
            } catch (err) {
                setStatus('Torche non disponible', 'error');
                torchEnabled = false;
            }
        }

        // ==================== GESTION SOURIS / TOUCH ====================
        function getCanvasCoords(evt) {
            const rect = boardCanvas.getBoundingClientRect();
            const scaleX = boardCanvas.width / rect.width;
            const scaleY = boardCanvas.height / rect.height;
            const clientX = evt.touches ? evt.touches[0].clientX : evt.clientX;
            const clientY = evt.touches ? evt.touches[0].clientY : evt.clientY;
            return {
                x: (clientX - rect.left) * scaleX,
                y: (clientY - rect.top) * scaleY
            };
        }

        function isInsideCamera(pos) {
            if (!cameraReady) return false;
            const dx = pos.x - camX;
            const dy = pos.y - camY;
            return (dx * dx + dy * dy) <= (camRadius * camRadius);
        }

        function isNearEdge(pos) {
            if (!cameraReady) return false;
            const dx = pos.x - camX;
            const dy = pos.y - camY;
            const dist = Math.sqrt(dx * dx + dy * dy);
            return dist > camRadius * 0.8 && dist <= camRadius + 15;
        }

        function onPointerDown(evt) {
            const pos = getCanvasCoords(evt);
            if (isInsideCamera(pos)) {
                if (isNearEdge(pos) && evt.touches && evt.touches.length === 2) {
                    const t1 = evt.touches[0];
                    const t2 = evt.touches[1];
                    resizeStartDist = Math.hypot(t1.clientX - t2.clientX, t1.clientY - t2.clientY);
                    resizeStartRadius = camRadius;
                    isResizing = true;
                    evt.preventDefault();
                    return;
                }
                isDragging = true;
                dragOffsetX = pos.x - camX;
                dragOffsetY = pos.y - camY;
                boardCanvas.style.cursor = 'grabbing';
                evt.preventDefault();

                const hint = document.getElementById('dragHint');
                if (hint && !hasDraggedOnce) hint.style.opacity = '0';
            }
        }

        function onPointerMove(evt) {
            const pos = getCanvasCoords(evt);
            if (isResizing && evt.touches && evt.touches.length === 2) {
                const t1 = evt.touches[0];
                const t2 = evt.touches[1];
                const dist = Math.hypot(t1.clientX - t2.clientX, t1.clientY - t2.clientY);
                const ratio = dist / resizeStartDist;
                const newRadius = Math.max(60, Math.min(500, resizeStartRadius * ratio));
                camRadius = newRadius;
                camSize = Math.round(newRadius);
                document.getElementById('camSize').value = Math.min(360, Math.max(80, camSize));
                document.getElementById('camSizeVal').textContent = document.getElementById('camSize').value;
                evt.preventDefault();
                return;
            }

            if (isDragging) {
                let newX = pos.x - dragOffsetX;
                let newY = pos.y - dragOffsetY;
                newX = Math.max(camRadius, Math.min(boardCanvas.width - camRadius, newX));
                newY = Math.max(camRadius, Math.min(boardCanvas.height - camRadius, newY));
                camX = newX;
                camY = newY;
                hasDraggedOnce = true;
                evt.preventDefault();
            } else {
                if (isNearEdge(pos)) boardCanvas.style.cursor = 'ew-resize';
                else if (isInsideCamera(pos)) boardCanvas.style.cursor = 'grab';
                else boardCanvas.style.cursor = 'crosshair';
            }
        }

        function onPointerUp(evt) {
            if (isDragging) {
                isDragging = false;
                boardCanvas.style.cursor = 'crosshair';
                evt.preventDefault();
            }
            if (isResizing) {
                isResizing = false;
                evt.preventDefault();
            }
        }

        boardCanvas.addEventListener('wheel', (evt) => {
            const pos = getCanvasCoords(evt);
            if (isInsideCamera(pos)) {
                evt.preventDefault();
                const delta = evt.deltaY > 0 ? -12 : 12;
                camRadius = Math.max(60, Math.min(500, camRadius + delta));
                camSize = Math.round(camRadius);
                const slider = document.getElementById('camSize');
                slider.value = Math.min(360, Math.max(80, camSize));
                document.getElementById('camSizeVal').textContent = slider.value;
            }
        }, { passive: false });

        boardCanvas.addEventListener('mousedown', onPointerDown);
        window.addEventListener('mousemove', onPointerMove);
        window.addEventListener('mouseup', onPointerUp);

        boardCanvas.addEventListener('touchstart', onPointerDown, { passive: false });
        window.addEventListener('touchmove', onPointerMove, { passive: false });
        window.addEventListener('touchend', onPointerUp, { passive: false });

        // ==================== OPTIONS UI ====================
        document.querySelectorAll('#boardSwatches .swatch').forEach(sw => {
            sw.addEventListener('click', () => {

        // ==================== RENDU ====================
        function drawBoardBackground() {
            const W = boardCanvas.width;
            const H = boardCanvas.height;
            const isLight = isLightColor(boardColor);

            boardCtx.fillStyle = boardColor;
            boardCtx.fillRect(0, 0, W, H);

            boardCtx.strokeStyle = isLight ? 'rgba(0,0,0,0.06)' : 'rgba(255,255,255,0.05)';
            boardCtx.lineWidth = 1;
            for (let y = 100; y < H; y += 60) {
                boardCtx.beginPath();
                boardCtx.moveTo(40, y);
                boardCtx.lineTo(W - 40, y);
                boardCtx.stroke();
            }
            boardCtx.strokeStyle = 'rgba(217,83,79,0.25)';
            boardCtx.lineWidth = 2;
            boardCtx.beginPath();
            boardCtx.moveTo(80, 40);
            boardCtx.lineTo(80, H - 40);
            boardCtx.stroke();
        }

        function isLightColor(hex) {
            const c = hex.replace('#', '');
            const r = parseInt(c.substr(0, 2), 16);
            const g = parseInt(c.substr(2, 2), 16);
            const b = parseInt(c.substr(4, 2), 16);
            const lum = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
            return lum > 0.6;
        }

        function drawSentenceOnBoard(item, index, total) {
            const W = boardCanvas.width;
            const H = boardCanvas.height;
            const isLight = isLightColor(boardColor);
            const isPortrait = H > W;

            if (!item) {
                boardCtx.font = `bold ${isPortrait ? 28 : 36}px "Segoe UI", sans-serif`;
                boardCtx.textAlign = 'center';
                boardCtx.textBaseline = 'middle';
                boardCtx.fillStyle = isLight ? 'rgba(0,0,0,0.25)' : 'rgba(255,255,255,0.25)';
                boardCtx.fillText('Chargez une liste pour commencer', W / 2, H / 2);
                return;
            }

            const textColor = item.isEnglish ? '#ff6b6b' : '#4dabf7';
            const badgeColor = item.isEnglish ? '#d9534f' : '#0275d8';
            const badgeText = item.isEnglish ? 'EN' : 'FR';

            const badgeSize = isPortrait ? 36 : 44;
            boardCtx.font = `bold ${isPortrait ? 16 : 20}px "Segoe UI", sans-serif`;
            const badgeWidth = boardCtx.measureText(badgeText).width + (isPortrait ? 28 : 36);
            boardCtx.fillStyle = badgeColor;
            drawRoundRect(boardCtx, 30, 30, badgeWidth, badgeSize, badgeSize / 2);
            boardCtx.fill();
            boardCtx.fillStyle = '#fff';
            boardCtx.textAlign = 'center';
            boardCtx.textBaseline = 'middle';
            boardCtx.fillText(badgeText, 30 + badgeWidth / 2, 30 + badgeSize / 2);

            if (total > 0) {
                boardCtx.font = `16px "Segoe UI", sans-serif`;
                boardCtx.fillStyle = isLight ? 'rgba(0,0,0,0.5)' : 'rgba(255,255,255,0.5)';
                boardCtx.textAlign = 'right';
                boardCtx.fillText(`${index + 1} / ${total}`, W - 30, 50);
            }

            const baseFontSize = isPortrait ? 48 : 64;
            const maxWidth = isPortrait ? W - 120 : W - 260;

            boardCtx.font = `bold ${baseFontSize}px "Segoe UI", sans-serif`;
            boardCtx.textAlign = 'center';
            boardCtx.textBaseline = 'middle';

            const words = item.text.split(' ');
            const lines = [];
            let currentLine = '';
            words.forEach(word => {
                const testLine = currentLine ? currentLine + ' ' + word : word;
                if (boardCtx.measureText(testLine).width > maxWidth && currentLine) {
                    lines.push(currentLine);
                    currentLine = word;
                } else currentLine = testLine;
            });
            lines.push(currentLine);

            const lineHeight = baseFontSize * 1.25;
            const totalHeight = lines.length * lineHeight;
            const centerY = isPortrait ? H * 0.42 : H / 2;
            const startY = centerY - (totalHeight / 2) + lineHeight / 2;

            lines.forEach((line, i) => {
                boardCtx.fillStyle = textColor;
                boardCtx.fillText(line, W / 2, startY + (i * lineHeight));
            });

            if (isPlaying && item.maxRepeats > 1) {
                boardCtx.font = `18px "Segoe UI", sans-serif`;
                boardCtx.fillStyle = isLight ? 'rgba(0,0,0,0.55)' : 'rgba(255,255,255,0.55)';
                boardCtx.textAlign = 'center';
                boardCtx.fillText(`Répétition ${repeatCounter + 1} / ${item.maxRepeats}`, W / 2, H - 100);
            }

            if (isPlaying) {
                const progress = (index + (repeatCounter / (item.maxRepeats || 1))) / Math.max(1, total);
                const barWidth = W * 0.6;
                const barX = (W - barWidth) / 2;
                const barY = H - 50;
                boardCtx.fillStyle = isLight ? 'rgba(0,0,0,0.1)' : 'rgba(255,255,255,0.1)';
                drawRoundRect(boardCtx, barX, barY, barWidth, 8, 4);
                boardCtx.fill();
                boardCtx.fillStyle = '#6c5ce7';
                drawRoundRect(boardCtx, barX, barY, barWidth * Math.min(progress, 1), 8, 4);
                boardCtx.fill();
            }
        }

        function drawCameraFrame(radius) {
            boardCtx.save();
            switch (frameStyle) {
                case 'white':
                    boardCtx.beginPath();
                    boardCtx.arc(camX, camY, radius + 6, 0, Math.PI * 2);
                    boardCtx.strokeStyle = 'rgba(255,255,255,0.95)';
                    boardCtx.lineWidth = 7;
                    boardCtx.stroke();
                    break;
                case 'glow':
                    boardCtx.shadowColor = '#6c5ce7';
                    boardCtx.shadowBlur = 30;
                    boardCtx.beginPath();
                    boardCtx.arc(camX, camY, radius + 3, 0, Math.PI * 2);
                    boardCtx.strokeStyle = '#a29bfe';
                    boardCtx.lineWidth = 6;
                    boardCtx.stroke();
                    boardCtx.shadowBlur = 0;
                    break;
                case 'neon':
                    boardCtx.beginPath();
                    boardCtx.arc(camX, camY, radius + 4, 0, Math.PI * 2);
                    boardCtx.strokeStyle = '#00e5ff';
                    boardCtx.lineWidth = 6;
                    boardCtx.shadowColor = '#00e5ff';
                    boardCtx.shadowBlur = 18;
                    boardCtx.stroke();
                    boardCtx.shadowBlur = 0;
                    break;
                case 'gold':
                    const grad = boardCtx.createLinearGradient(camX - radius, camY - radius, camX + radius, camY + radius);
                    grad.addColorStop(0, '#f9d423');
                    grad.addColorStop(0.5, '#ff4e50');
                    grad.addColorStop(1, '#f9d423');
                    boardCtx.beginPath();
                    boardCtx.arc(camX, camY, radius + 5, 0, Math.PI * 2);
                    boardCtx.strokeStyle = grad;
                    boardCtx.lineWidth = 8;
                    boardCtx.stroke();
                    break;
                case 'dashed':
                    boardCtx.beginPath();
                    boardCtx.arc(camX, camY, radius + 5, 0, Math.PI * 2);
                    boardCtx.strokeStyle = 'rgba(255,255,255,0.9)';
                    boardCtx.lineWidth = 6;
                    boardCtx.setLineDash([14, 10]);
                    boardCtx.stroke();
                    boardCtx.setLineDash([]);
                    break;
                case 'none':
                default:
                    boardCtx.beginPath();
                    boardCtx.arc(camX, camY, radius, 0, Math.PI * 2);
                    boardCtx.strokeStyle = 'rgba(255,255,255,0.3)';
                    boardCtx.lineWidth = 1;
                    boardCtx.stroke();
                    break;
            }
            boardCtx.restore();
        }

        function drawCameraCircle() {
            if (!cameraReady || videoElement.readyState < 2) return;

            const radius = camRadius;
            if (camX === 0 && camY === 0) {
                camX = boardCanvas.width - radius - 50;
                camY = boardCanvas.height - radius - 50;
            }

            // Ombre
            boardCtx.save();
            boardCtx.beginPath();
            boardCtx.arc(camX, camY, radius + 8, 0, Math.PI * 2);
            boardCtx.fillStyle = 'rgba(0,0,0,0.3)';
            boardCtx.fill();
            boardCtx.restore();

            // Clip + image caméra avec fond virtuel
            boardCtx.save();
            boardCtx.beginPath();
            boardCtx.arc(camX, camY, radius, 0, Math.PI * 2);
            boardCtx.closePath();
            boardCtx.clip();

            // Fond virtuel coloré + personne découpée
            const sourceCanvas = getCameraWithBackground();
            const diameter = radius * 2;
            const srcW = sourceCanvas.width || boardCanvas.width;
            const srcH = sourceCanvas.height || boardCanvas.height;
            const scale = Math.max(diameter / srcW, diameter / srcH);
            const drawW = srcW * scale;
            const drawH = srcH * scale;
            const offsetX = camX - drawW / 2;
            const offsetY = camY - drawH / 2;

            boardCtx.filter = getFilterString();
            boardCtx.drawImage(sourceCanvas, offsetX, offsetY, drawW, drawH);
            boardCtx.filter = 'none';
            boardCtx.restore();

            drawCameraFrame(radius);

            // Poignée visuelle
            boardCtx.beginPath();
            boardCtx.arc(camX, camY + radius - 4, 5, 0, Math.PI * 2);
            boardCtx.fillStyle = 'rgba(255,255,255,0.85)';
            boardCtx.fill();
            boardCtx.beginPath();
            boardCtx.arc(camX, camY + radius - 4, 5, 0, Math.PI * 2);
            boardCtx.strokeStyle = 'rgba(0,0,0,0.4)';
            boardCtx.lineWidth = 1;
            boardCtx.stroke();
        }

        function drawRoundRect(ctx, x, y, w, h, r) {
            if (w < 2 * r) r = w / 2;
            if (h < 2 * r) r = h / 2;
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.arcTo(x + w, y, x + w, y + h, r);
            ctx.arcTo(x + w, y + h, x, y + h, r);
            ctx.arcTo(x, y + h, x, y, r);
            ctx.arcTo(x, y, x + w, y, r);
            ctx.closePath();
        }

        function startBoardRendering() {
            if (animationFrameId) cancelAnimationFrame(animationFrameId);

            function render(timestamp) {
                if (timestamp - lastRenderTime < 33) {
                    animationFrameId = requestAnimationFrame(render);
                    return;
                }
                lastRenderTime = timestamp;

                drawBoardBackground();
                const activeIndex = isPlaying ? currentIndex : 0;
                const item = sentenceData[activeIndex];
                drawSentenceOnBoard(item, activeIndex, sentenceData.length);
                drawCameraCircle();

                animationFrameId = requestAnimationFrame(render);
            }
            animationFrameId = requestAnimationFrame(render);
        }

        // ==================== TTS (muet) ====================
        function processText() {
            stopSpeech();
            const input = document.getElementById('textInput').value;
            const lines = input.split('\n').map(l => l.trim()).filter(l => l !== "");
            sentenceData = [];
            lines.forEach((line, index) => {
                const isEnglish = index % 2 === 0;
                sentenceData.push({
                    text: line,
                    lang: isEnglish ? 'en-US' : 'fr-FR',
                    isEnglish: isEnglish,
                    maxRepeats: isEnglish ? 3 : 2
                });
            });
            if (sentenceData.length > 0) {
                document.getElementById('playBtn').disabled = false;
                document.getElementById('recordBtn').disabled = false;
                setStatus(`✅ Liste chargée : ${sentenceData.length} lignes · TTS muet`, 'success');
                if (!animationFrameId) startBoardRendering();
            } else {
                document.getElementById('playBtn').disabled = true;
                document.getElementById('recordBtn').disabled = true;
                setStatus('Aucune ligne valide', 'error');
            }
        }

        function estimateDuration(text, isEnglish) {
            const words = text.split(/\s+/).length;
            const wpm = isEnglish ? 140 : 160;
            return Math.round(Math.max(2, (words / wpm) * 60) * 1000 + 500);
        }

        function speakStep() {
            if (!isPlaying || isPaused) return;
            if (currentIndex >= sentenceData.length) {
                if (isLooping) {
                    currentIndex = 0; repeatCounter = 0;
                    setTimeout(speakStep, 1000);
                } else stopSpeech();
                return;
            }
            const currentItem = sentenceData[currentIndex];
            const utterance = new SpeechSynthesisUtterance(currentItem.text);
            utterance.lang = currentItem.lang;
            const voices = synth.getVoices();
            const voice = voices.find(v => v.lang.startsWith(currentItem.lang));
            if (voice) utterance.voice = voice;
            utterance.volume = 0.0;
            utterance.rate = 0.95;
            utterance.pitch = 1.0;
            sentenceDurationMs = estimateDuration(currentItem.text, currentItem.isEnglish);
            sentenceStartTime = Date.now();

            utterance.onend = () => {
                if (!isPlaying || isPaused) return;
                repeatCounter++;
                if (repeatCounter < currentItem.maxRepeats) setTimeout(speakStep, 400);
                else {
                    currentIndex++;
                    repeatCounter = 0;
                    setTimeout(speakStep, 800);
                }
            };
            utterance.onerror = (e) => { console.warn('TTS:', e); if (isPlaying) stopSpeech(); };
            synth.speak(utterance);
        }

        function startPlayAll() {
            if (sentenceData.length === 0) return;
            synth.cancel();
            isPlaying = true;
            isPaused = false;
            currentIndex = 0;
            repeatCounter = 0;
            document.getElementById('playBtn').style.display = 'none';
            document.getElementById('pauseBtn').style.display = 'flex';
            document.getElementById('pauseBtn').innerText = "⏸ Pause";
            speakStep();
        }

        function togglePause() {
            if (!isPlaying) return;
            if (!isPaused) {
                isPaused = true; synth.pause();
                document.getElementById('pauseBtn').innerText = "▶ Reprendre";
            } else {
                isPaused = false;
                document.getElementById('pauseBtn').innerText = "⏸ Pause";
                if (synth.paused) synth.resume();
                else speakStep();
            }
        }

        function stopSpeech() {
            isPlaying = false; isPaused = false; synth.cancel();
            document.getElementById('playBtn').style.display = 'flex';
            document.getElementById('playBtn').disabled = (sentenceData.length === 0);
            document.getElementById('pauseBtn').style.display = 'none';
        }

        function toggleLoop() {
            isLooping = !isLooping;
            const btn = document.getElementById('loopBtn');
            if (isLooping) { btn.classList.add('active'); btn.innerText = "🔁 Boucle : ON"; }
            else { btn.classList.remove('active'); btn.innerText = "🔁 Boucle : OFF"; }
        }

        // ==================== MIC ====================
        async function startMicCapture() {
            try {
                micStream = await navigator.mediaDevices.getUserMedia({
                    audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false, sampleRate: 48000 }
                });
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') await audioCtx.resume();
                micSource = audioCtx.createMediaStreamSource(micStream);
                micAnalyser = audioCtx.createAnalyser();
                micAnalyser.fftSize = 256;
                micSource.connect(micAnalyser);
                recordDestination = audioCtx.createMediaStreamDestination();
                micSource.connect(recordDestination);
                return recordDestination.stream;
            } catch (err) {
                setStatus('⚠️ Micro inaccessible : ' + err.name, 'warn');
                return null;
            }
        }

        function stopMicCapture() {
            if (micStream) { micStream.getTracks().forEach(t => t.stop()); micStream = null; }
            if (audioCtx) { audioCtx.close().catch(() => {}); audioCtx = null; }
            micAnalyser = null; micSource = null; recordDestination = null;
        }

        // ==================== ENREGISTREMENT ====================
        async function toggleRecording() {
            if (isRecording) { stopRecording(); return; }
            await startRecording();
        }

        function pickBestMimeType() {
            const candidates = [
                'video/mp4;codecs=avc1.42E01E,mp4a.40.2',
                'video/mp4;codecs=avc1.42E01E',
                'video/mp4;codecs=h264,aac',
                'video/mp4',
                'video/webm;codecs=h264,opus',
                'video/webm;codecs=vp9,opus',
                'video/webm;codecs=vp8,opus',
                'video/webm'
            ];
            for (const c of candidates) if (MediaRecorder.isTypeSupported(c)) return c;
            return 'video/webm';
        }

        async function startRecording() {
            if (sentenceData.length === 0) { setStatus('Chargez d\'abord une liste', 'error'); return; }
            if (!cameraReady) { await initCamera(); await new Promise(r => setTimeout(r, 800)); }

            setStatus('🎤 Demande d\'accès au micro...', 'info');
            const micAudioStream = await startMicCapture();
            if (!micAudioStream) { setStatus('❌ Micro requis pour le son.', 'error'); return; }

            recordedChunks = [];
            const canvasStream = boardCanvas.captureStream(30);
            const combinedStream = new MediaStream([
                ...canvasStream.getVideoTracks(),
                ...micAudioStream.getAudioTracks()
            ]);
            const mimeType = pickBestMimeType();

            try {
                mediaRecorder = new MediaRecorder(combinedStream, { 
                    mimeType, videoBitsPerSecond: 4000000, audioBitsPerSecond: 128000
                });
            } catch (e) {
                setStatus('Enregistrement non supporté : ' + e.message, 'error');
                stopMicCapture(); return;
            }

            mediaRecorder.ondataavailable = (event) => {
                if (event.data && event.data.size > 0) recordedChunks.push(event.data);
            };

            mediaRecorder.onstop = () => {
                stopMicCapture();
                if (recordedChunks.length === 0) {
                    setStatus('Aucune donnée enregistrée', 'error');
                    isRecording = false; return;
                }
                const actualMime = mediaRecorder.mimeType || mimeType;
                const ext = actualMime.includes('mp4') ? 'mp4' : 'webm';
                const blob = new Blob(recordedChunks, { type: actualMime.split(';')[0] });
                if (blob.size < 1000) {
                    setStatus('Enregistrement trop court ou vide', 'error');
                    isRecording = false; return;
                }
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                const fmtLabel = FORMATS[currentFormat].label.replace(/\s+/g, '-').toLowerCase();
                a.download = `apprentissage-${fmtLabel}-${Date.now()}.${ext}`;
                document.body.appendChild(a); a.click(); document.body.removeChild(a);
                setTimeout(() => URL.revokeObjectURL(url), 10000);
                setStatus(`✅ Vidéo téléchargée (${ext.toUpperCase()}, ${(blob.size/1024/1024).toFixed(1)} Mo)`, 'success');
                isRecording = false;
                const btn = document.getElementById('recordBtn');
                btn.classList.remove('recording'); btn.innerText = '⏺ Enregistrer';
            };

            mediaRecorder.onerror = (e) => {
                setStatus('Erreur d\'enregistrement : ' + (e.error?.message || e.error), 'error');
                stopMicCapture();
            };

            mediaRecorder.start(1000);
            isRecording = true;
            const btn = document.getElementById('recordBtn');
            btn.classList.add('recording'); btn.innerText = '⏹ Arrêter';
            setStatus(`⏺ Enregistrement (${FORMATS[currentFormat].label})...`, 'success');
            if (!isPlaying) startPlayAll();
            recordTimer = setTimeout(() => { if (isRecording) stopRecording(); }, RECORD_DURATION_MS);
        }

        function stopRecording() {
            if (!isRecording) return;
            if (recordTimer) { clearTimeout(recordTimer); recordTimer = null; }
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.requestData();
                setTimeout(() => mediaRecorder.stop(), 200);
            }
        }

        // ==================== INIT ====================
        window.addEventListener('load', () => {
            applyFormat('youtube');
            startBoardRendering();
            initCamera();
            if (speechSynthesis.onvoiceschanged !== undefined) {
                speechSynthesis.onvoiceschanged = () => synth.getVoices();
            }
            document.getElementById('camSizeVal').textContent = camSize;
        });

        window.addEventListener('beforeunload', () => {
            if (cameraStream) cameraStream.getTracks().forEach(t => t.stop());
            if (micStream) micStream.getTracks().forEach(t => t.stop());
            if (animationFrameId) cancelAnimationFrame(animationFrameId);
            segmentationLoopActive = false;
        });
    </script>
</body>
</html>
